[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openestates-api"
path = "src/main.rs"

[lib]
name = "backend"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
daggy = "0.9.0"
object_store = "0.13.2"
sha2 = "0.11.0"
tantivy = "0.26.1"
futures-util = "0.3"
async-trait = "0.1"
arrow = { version = "58.3.0", default-features = false }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }
datafusion = { version = "54.0.0", default-features = false, features = ["parquet", "sql"] }
url = "2"
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
