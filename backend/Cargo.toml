[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openestates-api"
path = "src/main.rs"

[[bin]]
name = "openestates-promote-materialization"
path = "src/bin/openestates-promote-materialization.rs"

[lib]
name = "backend"
path = "src/lib.rs"

[features]
default = []
s3 = ["object_store/aws"]

[dependencies]
arc-swap = "1"
axum = "0.8"
bytes = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs", "set-header", "timeout"] }
chrono = { version = "0.4", features = ["serde"] }
daggy = "0.9.0"
object_store = "0.13.2"
sha2 = "0.11.0"
tantivy = "0.26.1"
futures-util = "0.3"
async-trait = "0.1"
arrow = { version = "58.3.0", default-features = false }
parquet = { version = "58.3.0", default-features = false, features = ["arrow", "zstd"] }
datafusion = { version = "54.0.0", default-features = false, features = ["parquet", "sql"] }
url = "2"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
rstar = "0.12"
geojson = "0.24"
lru = "0.16"
winnow = "1.0.4"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tower = "0.5"
governor = "0.10.4"
toml = "0.9.5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Keep the dev build's disk footprint bounded. The heavy dependency trees
# (datafusion, arrow, parquet, tantivy) dominate target/debug/deps when compiled
# with full debug symbols, and the incremental cache grows unbounded across builds.
[profile.dev]
incremental = false

# Strip debug info from dependencies only; our own crates keep line-table info
# so backtraces still resolve to file:line.
[profile.dev.package."*"]
debug = false
